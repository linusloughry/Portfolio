<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video — Jordan Rivera</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-dark">

  <div class="topbar">
    <a href="index.html" class="logo">JORDAN RIVERA</a>
    <div class="nav">
      <a href="video.html">Video</a>
      <a href="photo.html">Photo</a>
      <a href="writing.html">Writing</a>
    </div>
  </div>

  <!-- REPLACE: full-bleed autoplay highlight reel. Should fade out on scroll
       (see js/main.js) and the actual <video> element should pause once
       scrolled out of view for performance. -->
  <div class="hero-placeholder" id="hero">
    Highlight Reel &middot; full-bleed autoplay &middot; fades on scroll
  </div>

  <!-- REPLACE: filter categories — currently placeholder (Documentary/News).
       Jordan noted more categories will likely be added. -->
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="documentary">Documentary</button>
    <button class="chip" data-filter="news">News</button>
  </div>

  <!-- REPLACE: real video thumbnails. Each .card should link/embed the actual
       video (YouTube/Vimeo/etc per Jordan's hosting choice per clip).
       Masonry sizing (c1–c5 classes) handles mixed horizontal/vertical clips. -->
  <div class="grid" id="video-grid">
    <div class="card" style="grid-column: span 2; height: 130px;" data-category="documentary">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
    <div class="card" style="grid-row: span 2; height: 272px;" data-category="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
    <div class="card" style="height: 130px;" data-category="documentary">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
    <div class="card" style="height: 130px;" data-category="news">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
    <div class="card" style="grid-column: span 2; height: 130px;" data-category="documentary">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </div>
  </div>

  <div style="height: 60px;"></div>

  <script src="js/main.js"></script>
</body>
</html>
