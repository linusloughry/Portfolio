<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video — Linus Loughry</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="mode-dark">

  <div class="topbar">
    <a href="index.html" class="logo">LINUS LOUGHRY</a>
    <div class="nav">
      <a href="video.html">Video</a>
      <a href="photo.html">Photo</a>
      <a href="writing.html">Writing</a>
    </div>
  </div>

  <!-- REPLACE: full-bleed autoplay highlight reel. Should fade out on scroll
       (see js/main.js) and the actual <video> element should pause once
       scrolled out of view for performance. -->
  <div class="hero-placeholder" id="hero">
    Highlight Reel &middot; full-bleed autoplay &middot; fades on scroll
  </div>

  <!-- REPLACE: filter categories — currently placeholder (Documentary/News).
       Jordan noted more categories will likely be added. -->
  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="documentary">Documentary</button>
    <button class="chip" data-filter="news">News</button>
  </div>

  <!-- REPLACE: real video embeds. Each .card is an inline iframe player
       (YouTube embed URL: youtube.com/embed/VIDEO_ID). Add inline
       style="aspect-ratio: 9 / 16" on .card for vertical clips.
       Non-YouTube clips (Instagram/Facebook originals) should be
       re-uploaded to YouTube (unlisted is fine) for a consistent player. -->
  <div class="grid" id="video-grid">
    <div class="video-item" data-category="documentary">
      <div class="card">
        <iframe src="https://www.youtube.com/embed/7Ggc1zDYLsM" title="Carousel Magic" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="video-title">Carousel Magic</div>
    </div>
    <div class="video-item" data-category="news">
      <div class="card">
        <iframe src="https://www.youtube.com/embed/lTkDrncjh-o" title="Bernie Sanders and AOC bring Fighting the Oligarchy tour to Denver" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
      <div class="video-title">Bernie Sanders and AOC bring "Fighting the Oligarchy" tour to Denver</div>
    </div>
    <div class="video-item" data-category="documentary">
      <div class="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
    </div>
    <div class="video-item" data-category="news">
      <div class="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8fa38a" stroke-width="1.5" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
    </div>
  </div>

  <div style="height: 60px;"></div>

  <script src="js/main.js"></script>
</body>
</html>
